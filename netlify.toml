[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["config/**"]

# Long-cache fingerprinted assets and fonts
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/booking/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

# Service pages moved under /services/ in the rebuild
[[redirects]]
  from = "/junk-removal/"
  to = "/services/junk-removal/"
  status = 301
[[redirects]]
  from = "/cleanouts/"
  to = "/services/cleanouts/"
  status = 301
[[redirects]]
  from = "/demolition/"
  to = "/services/demolition/"
  status = 301
[[redirects]]
  from = "/construction-debris-removal/"
  to = "/services/construction-debris-removal/"
  status = 301

# Legacy URLs from the previous (Squarespace) site
[[redirects]]
  from = "/services/full-service-junk-removal/"
  to = "/services/junk-removal/"
  status = 301
[[redirects]]
  from = "/services/dumpster-rental/"
  to = "/services/construction-debris-removal/"
