[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["config/**"]

# Long-cache fingerprinted assets and fonts
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    # Framing: this site itself, plus the Elward AI Dev client portal's live preview
    # of the site. Every other site is still refused. (Replaces X-Frame-Options,
    # which can't name another origin.)
    Content-Security-Policy = "frame-ancestors 'self' https://portal.elwardai.dev"

[[headers]]
  for = "/booking/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

# Canonical host is https://stlouishjr.com. These rules only match the non-canonical
# hosts, so the apex itself is not redirected.
[[redirects]]
  from = "http://stlouishjr.com/*"
  to = "https://stlouishjr.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.stlouishjr.com/*"
  to = "https://stlouishjr.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.stlouishjr.com/*"
  to = "https://stlouishjr.com/:splat"
  status = 301
  force = true

